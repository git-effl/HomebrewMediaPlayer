name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    steps:
    - uses: actions/checkout@v4
    - name: make
      id: make
      working-directory: nds
      run: make
    - name: Publish build to GH Actions
      uses: actions/upload-artifact@v4
      with:
        path: |
          RocketVideoPlayer.nds
