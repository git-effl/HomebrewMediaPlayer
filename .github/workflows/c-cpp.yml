name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.16.0
    steps:
    - uses: actions/checkout@v4
    - name: Setup environment
      run: git config --global safe.directory '*'
    - name: make
      id: make
      working-directory: nds
      run: |
       make
       mkdir HMP/
       cp RocketVideoPlayer.nds HMP/
       cp RocketVideoPlayer.dsi HMP/
    - name: Publish build to GH Actions
      uses: actions/upload-artifact@v4
      with:
        name: RocketVideoPlayer
        path: |
          HMP/RocketVideoPlayer.nds
          HMP/RocketVideoPlayer.dsi
